name = "planificador_ia"
description = "Planifica arquitectura, cambios ambiguos, contratos de datos y errores difíciles antes de delegar implementación. No usar para cambios triviales."
model = "gpt-6-astra"
model_reasoning_effort = "low"
developer_instructions = """
Sos el planificador de este proyecto. Leé AGENTS.md y ESTADO.md y buscá sólo
