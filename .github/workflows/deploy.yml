name: Deploy to Google Apps Script and GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Verify operational contracts and behavior
        run: |
          node scripts/verify-v2.js
          node scripts/verify-par.js
          node scripts/verify-reception-guide.js
          node scripts/verify-local-drafts.js
          node scripts/verify-local-catalog.js
          node scripts/verify-jsonp.js
          node scripts/verify-dashboard-render.js
          node scripts/verify-unit-quantities.js
          node scripts/verify-order-send.js
          node scripts/verify-responsables.js
          node scripts/verify-v3-core.js
          node scripts/verify-v3-backend.js
          node scripts/verify-v3-encargado.js
          node scripts/verify-v3-compras.js
          node scripts/v3-bundle-gas.js --check
          node scripts/verify-app.js

  deploy-gas:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Apply admin backend routes
        run: python3 scripts/patch_admin_backend.py

      - name: Write Clasp Credentials
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Write Clasp Project Config
        run: |
          echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"."}' > gas/.clasp.json

      - name: Push to Apps Script
        run: |
          cd gas
          clasp push -f

      - name: Update public Apps Script deployment
        run: |
          DEPLOYMENT_ID=$(python3 -c "import re,pathlib; print(re.search(r'https://script\.google\.com/macros/s/([^/]+)/exec', pathlib.Path('index.html').read_text(encoding='utf-8')).group(1))")
          cd gas
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

  deploy-gas-v3:
    needs: verify
    runs-on: ubuntu-latest
    env:
      GAS_V3_SCRIPT_ID: ${{ secrets.GAS_V3_SCRIPT_ID }}
      GAS_V3_DEPLOYMENT_ID: ${{ secrets.GAS_V3_DEPLOYMENT_ID }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Skip when V3 Apps Script is not configured
        id: gate
        run: |
          if [ -z "$GAS_V3_SCRIPT_ID" ] || [ -z "$GAS_V3_DEPLOYMENT_ID" ]; then
            echo "V3 Apps Script secrets not set; skipping V3 backend deploy."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Push and deploy V3 Apps Script
        if: steps.gate.outputs.run == 'true'
        run: |
          npm install -g @google/clasp
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
          echo "{\"scriptId\":\"$GAS_V3_SCRIPT_ID\",\"rootDir\":\".\"}" > v3/gas/.clasp.json
          cd v3/gas
          clasp push -f
          clasp deploy --deploymentId "$GAS_V3_DEPLOYMENT_ID" --description "V3 GitHub ${GITHUB_SHA::7}"

  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/
          cp admin.js site/
          cp favicon.svg site/ 2>/dev/null || true
          mkdir -p site/v3
          cp v3/*.html v3/*.js v3/*.css site/v3/
          mkdir -p site/app
          cp -r app/. site/app/
          sed -i "s/const VERSION = 'docks-app-v1';/const VERSION = 'docks-app-${GITHUB_SHA::7}';/" site/app/sw.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="admin.js?v=20260816"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>')
              else:
                  s += '\n'+tag+'\n'
          p.write_text(s,encoding='utf-8')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
