name: Deploy to Google Apps Script and GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Clasp
        run: npm install -g @google/clasp

      - name: Write Clasp Credentials
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Write Clasp Project Config
        run: |
          echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"."}' > gas/.clasp.json

      - name: Push to Apps Script
        run: |
          # Solo pusheamos la carpeta gas/
          cd gas
          clasp push -f

  deploy-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/
          cp favicon.svg site/ 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
