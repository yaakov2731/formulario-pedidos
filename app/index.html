<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F4F6">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1320">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Docks">
  <meta name="description" content="Pedidos, conteos, recepciones y compras de los locales de Docks del Puerto.">
  <title>Docks</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('docksapp:tema');
        if (t) { t = JSON.parse(t); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="app no-nav">
    <aside id="sidebar" class="sidebar" aria-label="Secciones"></aside>
    <div class="main" id="main">
      <div id="topbar" class="topbar" hidden>
        <div class="topbar-left" id="topbar-left"></div>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-right" id="topbar-right"></div>
      </div>
      <div id="view" class="wrap" aria-live="polite"></div>
    </div>
    <nav id="tabbar" class="tabbar" aria-label="Secciones" hidden></nav>
  </div>
  <noscript><p style="padding:24px;font-family:sans-serif">La app necesita JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
